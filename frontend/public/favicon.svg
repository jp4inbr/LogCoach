<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Marca "Pulso" do LogCoach, versão de 16 px. Segue o tema do sistema, como o site. -->
  <style>
    .a { stop-color: #ff8906; }
    .b { stop-color: #e53170; }
    .line { stroke: #0f0e17; }
    @media (prefers-color-scheme: light) {
      .a { stop-color: #ffd803; }
      .b { stop-color: #bae8e8; }
      .line { stroke: #272343; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="a" />
      <stop offset="1" class="b" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)" />
  <path class="line" d="M11 44 L25 30 L32 46 L52 16" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
