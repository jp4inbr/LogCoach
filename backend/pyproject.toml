[project]
name = "logcoach-backend"
version = "0.1.0"
description = "Backend do LogCoach (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pyyaml",
    "sqlmodel",
    "pydantic-settings",
    "email-validator",
    "argon2-cffi",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["samples/*.json", "rules/*.yaml", "encounters/*.yaml", "i18n/*.yaml", "guides/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
