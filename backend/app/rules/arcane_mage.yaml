# Regras da especialização: Mago Arcano (Midnight, temporada 2)
# Regras do Arthur (jogador de referência) + padrão medido nos top 10 Arcanos
# do Nek'zali Mítico no mesmo bracket de item level (326–328), em 20/10/2026.

spec: Arcane Mage

cooldowns:
  - name: Arcane Surge
    ability_id: 365350
    cooldown_s: 90            # tops: ~93 s entre usos, contando atraso de GCD
    pair_with: touch_of_the_magi
  - name: Touch of the Magi
    ability_id: 321507
    cooldown_s: 45            # tops: ~46–47 s entre usos
    use_on_cooldown: true     # atrasar quebra o alinhamento com o próximo Surge
    pair_with: arcane_surge

# Combo principal: Surge e Touch juntos.
combos:
  - name: Surge + Touch
    first: arcane_surge
    then: touch_of_the_magi
    max_gap_s: 3.5            # tops: Touch de 0,1 a 3,2 s depois do Surge
    # Pode atrasar o Touch um pouco para soltar antes um Prismatic Bolt ou um
    # Arcane Barrage (tops fazem Barrage logo antes do Touch quase sempre).
    allowed_before: [arcane_barrage, prismatic_bolt]
  # Regra do Arthur: se o Touch atrasar e dessincronizar, segurar o Surge para o
  # próximo Touch perde dano. Isso conta como erro de execução no Touch, não no Surge.
  # Segurar o Surge até ~15 s não é erro quando é para casar com a poção ou com
  # uma fase definida em allowed_holds do encontro.

abilities:
  arcane_surge: 365350
  touch_of_the_magi: 321507
  arcane_missiles: 5143
  arcane_barrage: 44425
  arcane_blast: 30451
  arcane_orb: 153626
  prismatic_bolt: 1295924
  shimmer: 212653
  time_warp: 80353

# Buffs lidos do log (stacks vêm nos eventos applybuffstack/removebuffstack).
buffs:
  arcane_salvo: 1242974       # stacks gastos pelo Arcane Barrage (cap 25 no Sunfury)
  clearcasting: 263725        # máximo de 3 cargas
  prismatic_bolt_proc: 1295942
  arcane_soul: 451038         # janela pós-Surge (Sunfury)

# Buffs de outros jogadores. Não são erro do Mago: entram como contexto na comparação
# (ex.: o top que recebe Power Infusion em todo Surge tem vantagem).
external_buffs:
  power_infusion: 10060       # Priest; no kill de referência, 2 no Harmonist (2:12 e 6:22)

# Barrage e Salvo (regra do Arthur, medida no top 10 do bracket 326–328).
barrage:
  min_salvo: 12               # Barrage abaixo disso é erro quando vira hábito
  pct_below_min: { warn: 8, error: 12 }   # tops: 4–11% (mediana ~6%); Arthur no kill: 15%
  # Tops soltam ~65% dos Barrages com Salvo no cap (25). Chegar no cap não é erro.
  # 1 Missiles + Prismatic Bolt antes do Barrage é o padrão sugerido pelo Arthur;
  # nos tops os dois padrões (1 ou 2 Missiles + Bolt) aparecem, então fica para a IA julgar.
  clearcasting_max: 3         # com 3 cargas, gastar 2 Missiles antes do Barrage evita perder proc

# Prismatic Bolt: decisão × sorte (regra do Arthur). Cada Salvo no Barrage dá 2% de chance
# de proc (25 → 50%, 11 → 22%); Barrage cedo perde Prismatic Bolt, não só o dano dos acúmulos.
# Validado em 28/10/2026 nas 11 fixtures (1.015 Barrages): 2,1% por Salvo; quase todo proc
# sai até 0,5 s depois do Barrage.
#   esperado = Σ (chance × Salvo) em cada Barrage      → mede a decisão do jogador
#   desvio   = √Σ p(1 − p)
#   sorte z  = (recebidos − esperado) ÷ desvio          → mede o RNG
# A spec é muito RNG: no kill de referência o Harmonist teve z −2,8 (azar raro) e um dos tops
# +3,5. O relatório separa as duas coisas para não cobrar azar como erro.
prismatic_bolt_rng:
  proc_per_salvo: 0.02
  proc_window_s: 0.5          # proc conta para o Barrage se aparecer até 0,5 s depois
  luck_z: { unlucky: -2, lucky: 2 }   # fora disso, a diferença de procs não é só sorte

defensives:
  - { name: Prismatic Barrier, ability_id: 235450 }   # tops do bracket: de 0 a 6 usos por kill
  - { name: Ice Cold, ability_id: 414658 }

consumables:
  - name: Light's Potential (poção)
    ability_id: 1236616
    cooldown_s: 300
    # Tops usam a 2ª poção por volta de 5:00 porque o 4º Surge deles cai ali. Segurar a
    # 2ª poção para casar com um Surge é o recomendado (poção + Surge rende mais que a
    # poção no CD), se a luta durar o bastante para esse Surge. Não é erro; o erro é
    # atrasar o Surge e dessincronizar o Touch.

# Referência de casts por minuto e % do dano (Archon, top 10 geral do Nek'zali
# Mítico, 25/10/2026, talentos de herói Sunfury). Usada na tabela do RF22 até o
# motor calcular a do bracket. Não é limite fixo: serve para apontar o que destoa.
reference_throughput:
  source: archon.gg (top 10 Nek'zali Mítico, 25/10/2026)
  hero_tree: Sunfury
  abilities:
    arcane_missiles: { cpm: 16.6, dmg_pct: 35.7 }
    prismatic_bolt:  { cpm: 6.0,  dmg_pct: 23.8 }
    arcane_barrage:  { cpm: 14.6, dmg_pct: 20.8 }
    arcane_blast:    { cpm: 3.2,  dmg_pct: 2.2 }
    arcane_orb:      { cpm: 0.5,  dmg_pct: 3.8 }
    touch_of_the_magi: { dmg_pct: 5.4 }

thresholds:
  downtime_pct: { warn: 2, error: 4 }   # tops e Arthur: ~99% de tempo ativo
  touch_drift_s: { warn: 3, error: 6 }  # atraso médio do Touch em relação ao CD
  surge_drift_s: { warn: 5, error: 10 } # atraso do Surge em relação ao CD
