# Regras do encontro: Nek'zali the Soulcoiler (The Venomous Abyss)
# Fonte: kill Mítico de referência, report XhrmBaYkGCAQjH2D, luta 34 (6:55).
# Tempos em segundos desde o início da luta, só como referência; o motor usa as
# transições de fase que vêm do próprio log (fights[].phases na API do WCL).

encounter: Nek'zali the Soulcoiler
encounter_id: 3470            # ID do encontro no Warcraft Logs
boss_npc_id: 259927           # Nek'zali
difficulties: [5]             # só Mítico na alfa (regras calibradas no kill Mítico)

phases:                       # IDs e nomes como o Warcraft Logs devolve
  - id: 1
    name: "Stage One: Soulcoiler Initiation"
    reference_start_s: 0.0
  - id: 2
    name: "Intermission: Ritual of Awakening"
    intermission: true
    reference_start_s: 166.7
  - id: 3
    name: "Stage Two: Uncoiling"
    reference_start_s: 267.4

# Na intermissão o chefe não recebe dano (confirmado no log: 0 de dano no
# Nek'zali na fase 2). O dano tem que ir para o Echo of Jawae, então isso NÃO
# é tempo parado: é troca de alvo.
untargetable:
  - name: Intermissão (Ritual of Awakening)
    phase: 2
    npc_id: 259927
    priority_targets:
      - { name: Echo of Jawae, npc_id: 263050 }

# Fases sem nada para bater, que saem da conta do tempo ativo. Aqui nenhuma: na intermissão
# há o Echo of Jawae e os Amani, então ficar parado nela é tempo parado.
downtime_excluded_phases: []

adds:
  - { name: Restless Amani, npc_id: 261509 }      # vão até o poço e dão energia ao chefe
  - { name: Echo of Jawae, npc_id: 263050 }       # alvo da intermissão
  - { name: Drowned Echo, npc_id: 268204 }        # Mítico (Grasping Depths)
  - { name: Summoner Jawae, npc_id: 263473 }
  - { name: Soulcoil Well, npc_id: 266756 }

# Cooldowns ofensivos nesta luta: usar assim que voltarem (on_cooldown).
# Referência: top 10 Arcanos do Mítico no bracket 326–328 de item level
# (rankings de 20/10/2026). Todos usam Surge no pull e a cada ~93 s, inclusive
# na intermissão. Segurar o Surge até ~15 s é aceito em dois casos vistos nos
# tops: casar com a 2ª poção (~5:00) ou com a volta do chefe no Stage Two.
burst_policy: on_cooldown
burst_windows:
  - name: Pull
    phase: 1
    offset_s: 0
    duration_s: 10
allowed_holds:
  - { reason: casar com a 2ª poção, max_s: 15 }
  - { reason: volta do chefe (início do Stage Two), phase: 3, max_s: 15 }

# Habilidades do chefe que marcam a linha do tempo (IDs de feitiço do Wowhead/WCL).
boss_abilities:
  - { name: Soulcoil Ignition, ability_id: 1293664, phase: 1 }   # aplica o DoT Soulcoil Rite
  - { name: Possession Barrage, ability_id: 1284103 }            # ~a cada 35 s nas fases 1 e 3
  - { name: Essence Rend, ability_id: 1287434, phase: 1 }        # debuff dissipável; vira poça (Latent Cultist)
  - { name: Soulcoiler's Curse, ability_id: 1300238, difficulty: mythic }  # conjurada pelo Drowned Echo: interromper
  - { name: Ritual of Awakening, ability_id: 1295124, phase: 1 } # anuncia a intermissão (~22 s antes)
  - { name: Soul Transfer, ability_id: 1293211 }                 # invoca os Echoes of Jawae
  - { name: Hungering Pyre, ability_id: 1289855, phase: 2 }
  - { name: Invoke, ability_id: 1299673, phase: 3, cast_s: 5 }   # ao terminar, interrompe e silencia 3 s quem estiver conjurando

# Fontes de dano recebido (IDs do DANO, diferentes do ID do cast acima).
damage_sources:
  - { name: Possession Barrage, ability_id: 1292034, cast_ability_id: 1284103 }
  - { name: Soulcoil Rite, ability_id: 1288772 }      # DoT: muito dano total, mas o healer segura sozinho
  - { name: Grasping Depths, ability_id: 1293214, difficulty: mythic }
  - { name: Uncoiling, ability_id: 1292315, phase: 3 }
  - { name: Corpse Blight, ability_id: 1307939 }

# Picos de dano (03/11, decisão do Arthur): o motor acha os picos no próprio log e explica de
# onde veio o dano, se um defensivo cabia ou se faltou cura. Pico = perder `damage_pct_hp` da
# vida máxima em `window_s` (dano depois da mitigação, contando escudos) OU ficar abaixo de
# `low_hp_pct`. Vale para todo encontro; aqui ficam os limites e a classe de cada mecânica.
defensive_policy: peaks
peaks:
  window_s: 4
  damage_pct_hp: 60
  low_hp_pct: 35
  heal_window_s: 5            # cura recebida logo depois do pico
  low_hp_s: 3                 # vida baixa por mais que isso com pouca cura = faltou cura
  low_heal_pct_hp: 20         # "pouca cura" = menos que isso da vida máxima na janela
  avoidable_share: 0.5        # pico com mais da metade do dano evitável = evitável
  danger_hp_pct: 50           # defensivo só "cabia" se a vida caiu abaixo disso (03/11: com
                              # 50%, Harmonist 1 pico e tops 13 em 10 lutas; com 60%, 2 e 23)
  # Dano evitável (% da vida por minuto) com menos de 5 tops. Nos tops de 03/11: de 0 a 15,2,
  # mediana 4,7; Harmonist 25,9.
  avoidable_reserve: { warn: 6, error: 15 }

# Classe de cada mecânica que bate nos jogadores (dano recebido). Fontes: Mythic Trap e
# WowCarry (Patch 12.1; o que está no Heroico vale no Mítico) e as 11 fixtures de 03/11
# (dano por minuto: evitável = quase zero nos tops).
# - avoidable: posicionamento; tomar é erro do jogador.
# - targeted: cai em jogadores sorteados; defensivo pessoal cabe.
# - assigned: depende da função na raide (soak, poço); não comparar com os tops.
# - raid: dano de raide inevitável; cura e, no pico, defensivo.
mechanics:
  - { name: Latent Cultist, ability_id: 1288554, class: avoidable }   # poça do Essence Rend: ficar longe (tops: mediana 18 mil/min, Harmonist 175 mil)
  - { name: Anguished Echoes, ability_id: 1294846, class: avoidable } # impacto de 5 m no Soulcoil Ignition: espalhar antes (tops: 0)
  - { name: Melee, ability_id: 1, class: avoidable }                  # golpe corpo a corpo do chefe/adds
  - { name: Essence Rend, ability_id: 1287434, class: targeted }      # debuff em jogadores sorteados
  - { name: Hungering Pyre, ability_id: 1289855, class: assigned }    # soak
  - { name: Vessel of Awakening, ability_id: 1297630, class: assigned }
  - { name: Soulcoil Rite, ability_id: 1288772, class: raid }
  - { name: Corpse Blight, ability_id: 1307939, class: raid }
  - { name: Corpse Blight, ability_id: 1294729, class: raid }
  - { name: Grasping Depths, ability_id: 1293214, class: raid }
  - { name: Possession Barrage, ability_id: 1292034, class: raid }    # só evitável para quem entra na linha; na prática todos tomam (~270 mil/min)
  - { name: Uncoiling, ability_id: 1292315, class: raid }
  - { name: Slithering Flame, ability_id: 1294933, class: raid }      # DoT de quem não fez o soak
  - { name: Cremation, ability_id: 1289875, class: raid }

# Combinações que costumam somar (descritivo, para a IA; o motor acha os picos sozinho).
overlaps:
  - name: Possession Barrage + Grasping Depths (Stage Two)
    phase: 3
    abilities: [1292034, 1293214]
  - name: Possession Barrage + aplicação do Soulcoil Rite (Stage One)
    phase: 1
    abilities: [1292034, 1288772]

# Candidata a regra (TODO: medir): estar conjurando quando o Invoke termina
# = interrupção + 3 s de silêncio, perda direta de dano na Fase 2.
cast_traps:
  - { name: Invoke, ability_id: 1299673, phase: 3, silence_s: 3 }
